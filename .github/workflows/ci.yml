name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo. Clears the
# actions/missing-workflow-permissions code-scanning alerts.
permissions:
  contents: read

jobs:
  js:
    name: JS syntax + format + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check js/Model.js && node --check js/State.js
      - name: "Format check (prettier, no semicolons)"
        run: npx -y prettier@3.9.6 --no-semi --check js/ tests/
      - name: Unit tests
        run: node --test tests/model.test.js tests/state.test.js tests/service.test.js tests/panel.test.js

  python:
    name: Python lint + format + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.6"
      - name: Lint
        run: ruff check python/ tests/
      - name: Format check
        run: ruff format --check python/ tests/
      - name: Unit tests
        run: python3 -m unittest discover -s tests

  qml:
    name: QML lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 24.04 ships qmllint/qmlformat 6.4, which formats
      # differently and uses older warning categories than this repo's
      # tooling (6.11). Pin the same Qt release as local dev so lint and
      # format behave identically on CI (see .qmllint.ini for the
      # cross-version category names). Shell/framework imports resolve
      # via lint/ (see lint/README.md), MaxWarnings=0 fails on any hit.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtbase qtdeclarative'
          cache: true
      - name: Lint QML files
        run: qmllint -I lint qml/*.qml qml/components/*.qml
      - name: Format check
        run: |
          fail=0
          for f in qml/*.qml qml/components/*.qml; do
            qmlformat "$f" | cmp -s - "$f" || { echo "needs formatting: $f (run: qmlformat -i $f)"; fail=1; }
          done
          exit $fail
