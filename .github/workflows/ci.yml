name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo. Clears the
# actions/missing-workflow-permissions code-scanning alerts.
permissions:
  contents: read

jobs:
  js:
    name: JS syntax + format + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check js/Model.js && node --check js/State.js
      - name: "Format check (prettier, no semicolons)"
        run: npx -y prettier@3.9.6 --no-semi --check js/ tests/
      - name: Unit tests
        run: node --test tests/model.test.js tests/state.test.js tests/service.test.js tests/panel.test.js

  python:
    name: Python lint + format + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.6"
      - name: Lint
        run: ruff check python/ tests/
      - name: Format check
        run: ruff format --check python/ tests/
      - name: Unit tests
        run: python3 -m unittest discover -s tests

  qml:
    name: QML lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # qmllint/qmlformat live in qt6-declarative-dev-tools (NOT
      # qt6-declarative-tools) and land in /usr/lib/qt6/bin, off PATH.
      # The QtQuick/Controls runtime modules must be installed too, or
      # qmllint can't import them and flags every type unresolved.
      # Shell/framework imports resolve via lint/ (see lint/README.md),
      # and .qmllint.ini fails on any remaining warning (MaxWarnings=0).
      - name: Install Qt declarative tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools qt6-declarative
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Debug qmllint categories
        run: |
          qmllint --version
          mkdir -p /tmp/lc && cd /tmp/lc && qmllint --write-defaults >/dev/null 2>&1 || true
          echo "=== defaults ==="
          cat /tmp/lc/.qmllint.ini 2>/dev/null || true
          echo "=== QtQuick tree ==="
          find /usr/lib/x86_64-linux-gnu/qt6/qml/QtQuick -maxdepth 1 -mindepth 1 | sort | head -30
      - name: Lint QML files
        run: qmllint -I lint qml/*.qml qml/components/*.qml
      - name: Format check
        run: |
          fail=0
          for f in qml/*.qml qml/components/*.qml; do
            qmlformat "$f" | cmp -s - "$f" || { echo "needs formatting: $f (run: qmlformat -i $f)"; fail=1; }
          done
          exit $fail
