[General]
DisableDefaultImports=false
# Zero tolerance: any warning fails the check (CI and local runs alike).
MaxWarnings=0

# omarchy-shell types several runtime APIs as plain QtObject (Style.font,
# bar.*), so their members are invisible to the linter although they
# resolve at runtime (verified: the panel renders). Those hits were
# audited as the same shell-typing noise, so the category is disabled.
# Genuine bug classes (property-override, incompatible-type, syntax,
# required, syntax-scoped unqualified) stay at warning.
#
# qmllint renamed categories between Qt 6.4/6.5 and Qt 6.6+, so every
# audited-noise category is listed under BOTH spellings. The running
# version ignores the keys it does not know, which keeps the same policy
# under Ubuntu 24.04's qmllint 6.4.2 and modern local tooling:
#   MissingProperty            (Qt 6.6+) == UnknownProperty   (Qt 6.4/6.5)
#   BadSignalHandlerParameters (Qt 6.6+) == BadSignalHandler  (Qt 6.4/6.5)
#   UnresolvedType             (Qt 6.6+) == TypeError         (Qt 6.4/6.5)
# The Process/JsonAdapter hits those muted for (QProcess::ExitStatus and
# C++-only FileViewAdapter never load into the linter) were previously
# handled by scoped directives whose names 6.4 does not know; the ini
# replaces them so both versions agree.
[Warnings]
MissingProperty=disable
UnknownProperty=disable
UnresolvedType=disable
TypeError=disable
BadSignalHandlerParameters=disable
BadSignalHandler=disable
ImportFailure=disable