[General]
DisableDefaultImports=false
MaxWarnings=-1

# omarchy-shell types several runtime APIs as plain QtObject (Style.font,
# bar.*), so their members are invisible to the linter although they
# resolve at runtime (verified: the panel renders). Every MissingProperty
# hit in this repo was audited as that same shell-typing noise, so the
# category is disabled; genuine bug classes (property-override,
# incompatible-type, syntax, required, unqualified) stay at warning.
[Warnings]
MissingProperty=disable
